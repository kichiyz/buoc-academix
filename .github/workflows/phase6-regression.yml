name: Phase 6 Platform Configuration Regression Tests

on:
  push:
    branches: [main, "phase-6/**"]
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "academix-config.js"
      - "tests/phase6-platform-configuration.test.mjs"
      - ".github/workflows/phase6-regression.yml"
      - "supabase/functions/generate-quiz/index.ts"
      - "tests/gemini-retry-resilience.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "academix-config.js"
      - "tests/phase6-platform-configuration.test.mjs"
      - ".github/workflows/phase6-regression.yml"
      - "supabase/functions/generate-quiz/index.ts"
      - "tests/gemini-retry-resilience.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 6 regression tests
        run: node --test tests/phase6-platform-configuration.test.mjs
      - name: Run Gemini retry resilience tests
        run: node --test tests/gemini-retry-resilience.test.mjs
