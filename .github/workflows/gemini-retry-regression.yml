name: Gemini Retry Resilience Regression Tests

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "supabase/functions/generate-quiz/index.ts"
      - "tests/gemini-retry-resilience.test.mjs"
      - ".github/workflows/gemini-retry-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/generate-quiz/index.ts"
      - "tests/gemini-retry-resilience.test.mjs"
      - ".github/workflows/gemini-retry-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-retry-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Gemini retry regression tests
        run: node --test tests/gemini-retry-resilience.test.mjs
