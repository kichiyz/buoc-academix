name: GitHub Pages Deployment

on:
  push:
    branches: [main, "phase-6/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate public deployment metadata
        env:
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const metadata = {
            version: `${process.env.BUILD_RUN_NUMBER}.${process.env.BUILD_RUN_ATTEMPT}`,
            commit: process.env.BUILD_COMMIT,
            builtAt: new Date().toISOString(),
            branch: process.env.BUILD_BRANCH,
            environment: process.env.BUILD_BRANCH === "main" ? "PRODUCTION" : "PREVIEW",
            runUrl: `https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.BUILD_RUN_ID}`
          };
          fs.writeFileSync(
            "academix-build.js",
            `window.ACADEMIX_BUILD = Object.freeze(${JSON.stringify(metadata)});\n`,
            "utf8"
          );
          console.log("Generated public build metadata:", metadata);
          NODE

      - name: Run Phase 6 regression tests
        run: node --test tests/phase6-platform-configuration.test.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
